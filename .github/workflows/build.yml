name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: ./build.sh
      - name: Smoke test
        run: ./build/PortSight.app/Contents/MacOS/PortSight --self-test
      - uses: actions/upload-artifact@v4
        with:
          name: PortSight
          path: build/PortSight.zip
